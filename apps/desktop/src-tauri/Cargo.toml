[package]
name = "nado-desktop"
version = "0.1.0"
description = "nado desktop shell"
authors = ["nado"]
edition = "2021"

[lib]
name = "nado_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
