      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Verify migrations against legacy data
        run: pnpm test:db:upgrade

      - name: Lint database schema
        run: pnpm supabase:lint

      - name: Run database security and performance advisors
        run: pnpm supabase:advisors

      - name: Run database integration tests
        run: pnpm test:db

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

      - name: Notify Slack on failure
        if: failure() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/notify-slack-failure
        with:
          job-name: Supabase migrations and database tests
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

