name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: quality
            name: Quality
          - target: mobile
            name: Mobile native
          - target: desktop
            name: Desktop native
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Notify Slack on checkout failure
        if: failure() && steps.checkout.outcome == 'failure'
        env:
          FAILED_JOB_NAME: ${{ matrix.name }} / Checkout
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GITHUB_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          GITHUB_RUN_LINK: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set. Skipping Slack notification."
            exit 0
          fi

          python3 - <<'PY' > slack-payload.json
          import html
          import json
          import os

          def escape_mrkdwn(value):
              return html.escape(value, quote=False)

          actor = escape_mrkdwn(os.environ["GITHUB_ACTOR_NAME"])
          branch = escape_mrkdwn(os.environ["GITHUB_BRANCH_NAME"])
          job_name = escape_mrkdwn(os.environ["FAILED_JOB_NAME"])
          short_sha = os.environ["GITHUB_SHA_VALUE"][:7]
          workflow = escape_mrkdwn(os.environ["GITHUB_WORKFLOW_NAME"])
          payload = {
              "text": f"nado CI failed on {branch}",
              "blocks": [
                  {
                      "type": "header",
                      "text": {
                          "type": "plain_text",
                          "text": "nado CI 실패",
                      },
                  },
                  {
                      "type": "section",
                      "fields": [
                          {
                              "type": "mrkdwn",
                              "text": f"*Workflow:*\n{workflow}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Job:*\n{job_name}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Branch:*\n{branch}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Actor:*\n{actor}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Commit:*\n`{short_sha}`",
                          },
                      ],
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"*실패한 run:*\n<{os.environ['GITHUB_RUN_LINK']}|GitHub Actions 로그 보기>",
                      },
                  },
              ],
          }
          print(json.dumps(payload))
          PY

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data @slack-payload.json \
            "$SLACK_WEBHOOK_URL"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Cache Rust dependencies
        if: matrix.target == 'desktop'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-rust-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: matrix.target == 'quality'
        run: pnpm format:check

      - name: Lint
        if: matrix.target == 'quality'
        run: pnpm lint

      - name: Typecheck
        if: matrix.target == 'quality'
        run: pnpm typecheck

      - name: Test
        if: matrix.target == 'quality'
        run: pnpm test

      - name: Build
        if: matrix.target == 'quality'
        env:
          NADO_API_BASE_URL: http://127.0.0.1:4000
        run: pnpm build

      - name: Validate Mobile native generation
        if: matrix.target == 'mobile'
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: |
          pnpm --filter @nado/mobile exec expo prebuild --no-install --platform ios
          pnpm --filter @nado/mobile verify:ios-pods
          git diff --exit-code -- apps/mobile/package.json apps/mobile/ios

      - name: Export Mobile platform bundles
        if: matrix.target == 'mobile'
        run: pnpm --filter @nado/mobile exec expo export --platform all --output-dir dist/ci-export

      - name: Validate Mobile design system bundles
        if: matrix.target == 'mobile'
        run: pnpm --filter @nado/mobile test:design-bundle

      - name: Install Tauri Linux dependencies
        if: matrix.target == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Build Desktop native shell
        if: matrix.target == 'desktop'
        run: pnpm --filter @nado/desktop tauri:build --no-bundle --ci

      - name: Notify Slack on failure
        if: failure() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/notify-slack-failure
        with:
          job-name: ${{ matrix.name }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  verify:
    name: Lint, typecheck, test, build
    needs: [verification]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve the required verification gate
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
        run: |
          if [ "$VERIFICATION_RESULT" != "success" ]; then
            echo "Verification matrix finished with: $VERIFICATION_RESULT"
            exit 1
          fi

          echo "All quality and native verification jobs passed."

