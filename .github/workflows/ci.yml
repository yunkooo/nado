name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Notify Slack on checkout failure
        if: failure() && steps.checkout.outcome == 'failure'
        env:
          FAILED_JOB_NAME: Lint, typecheck, test, build / Checkout
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GITHUB_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          GITHUB_RUN_LINK: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set. Skipping Slack notification."
            exit 0
          fi

          python3 - <<'PY' > slack-payload.json
          import html
          import json
          import os

          def escape_mrkdwn(value):
              return html.escape(value, quote=False)

          actor = escape_mrkdwn(os.environ["GITHUB_ACTOR_NAME"])
          branch = escape_mrkdwn(os.environ["GITHUB_BRANCH_NAME"])
          job_name = escape_mrkdwn(os.environ["FAILED_JOB_NAME"])
          short_sha = os.environ["GITHUB_SHA_VALUE"][:7]
          workflow = escape_mrkdwn(os.environ["GITHUB_WORKFLOW_NAME"])
          payload = {
              "text": f"nado CI failed on {branch}",
              "blocks": [
                  {
                      "type": "header",
                      "text": {
                          "type": "plain_text",
                          "text": "nado CI 실패",
                      },
                  },
                  {
                      "type": "section",
                      "fields": [
                          {
                              "type": "mrkdwn",
                              "text": f"*Workflow:*\n{workflow}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Job:*\n{job_name}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Branch:*\n{branch}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Actor:*\n{actor}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Commit:*\n`{short_sha}`",
                          },
                      ],
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"*실패한 run:*\n<{os.environ['GITHUB_RUN_LINK']}|GitHub Actions 로그 보기>",
                      },
                  },
              ],
          }
          print(json.dumps(payload))
          PY

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data @slack-payload.json \
            "$SLACK_WEBHOOK_URL"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Notify Slack on failure
        if: failure() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/notify-slack-failure
        with:
          job-name: Lint, typecheck, test, build
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  e2e:
    name: E2E smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Notify Slack on checkout failure
        if: failure() && steps.checkout.outcome == 'failure'
        env:
          FAILED_JOB_NAME: E2E smoke / Checkout
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GITHUB_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          GITHUB_RUN_LINK: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set. Skipping Slack notification."
            exit 0
          fi

          python3 - <<'PY' > slack-payload.json
          import html
          import json
          import os

          def escape_mrkdwn(value):
              return html.escape(value, quote=False)

          actor = escape_mrkdwn(os.environ["GITHUB_ACTOR_NAME"])
          branch = escape_mrkdwn(os.environ["GITHUB_BRANCH_NAME"])
          job_name = escape_mrkdwn(os.environ["FAILED_JOB_NAME"])
          short_sha = os.environ["GITHUB_SHA_VALUE"][:7]
          workflow = escape_mrkdwn(os.environ["GITHUB_WORKFLOW_NAME"])
          payload = {
              "text": f"nado CI failed on {branch}",
              "blocks": [
                  {
                      "type": "header",
                      "text": {
                          "type": "plain_text",
                          "text": "nado CI 실패",
                      },
                  },
                  {
                      "type": "section",
                      "fields": [
                          {
                              "type": "mrkdwn",
                              "text": f"*Workflow:*\n{workflow}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Job:*\n{job_name}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Branch:*\n{branch}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Actor:*\n{actor}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Commit:*\n`{short_sha}`",
                          },
                      ],
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"*실패한 run:*\n<{os.environ['GITHUB_RUN_LINK']}|GitHub Actions 로그 보기>",
                      },
                  },
              ],
          }
          print(json.dumps(payload))
          PY

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data @slack-payload.json \
            "$SLACK_WEBHOOK_URL"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm e2e:install

      - name: Run Storybook browser tests
        run: pnpm --filter @nado/storybook test:stories

      - name: Run e2e smoke tests
        run: pnpm e2e

      - name: Notify Slack on failure
        if: failure() && steps.checkout.outcome == 'success'
        uses: ./.github/actions/notify-slack-failure
        with:
          job-name: E2E smoke
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
