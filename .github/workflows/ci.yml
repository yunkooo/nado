name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GITHUB_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          GITHUB_RUN_LINK: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not set. Skipping Slack notification."
            exit 0
          fi

          python3 - <<'PY' > slack-payload.json
          import json
          import os

          short_sha = os.environ["GITHUB_SHA_VALUE"][:7]
          payload = {
              "text": f"nado CI failed on {os.environ['GITHUB_BRANCH_NAME']}",
              "blocks": [
                  {
                      "type": "header",
                      "text": {
                          "type": "plain_text",
                          "text": "nado CI 실패",
                      },
                  },
                  {
                      "type": "section",
                      "fields": [
                          {
                              "type": "mrkdwn",
                              "text": f"*Workflow:*\\n{os.environ['GITHUB_WORKFLOW_NAME']}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Branch:*\\n{os.environ['GITHUB_BRANCH_NAME']}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Actor:*\\n{os.environ['GITHUB_ACTOR_NAME']}",
                          },
                          {
                              "type": "mrkdwn",
                              "text": f"*Commit:*\\n`{short_sha}`",
                          },
                      ],
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": f"*실패한 run:*\\n<{os.environ['GITHUB_RUN_LINK']}|GitHub Actions 로그 보기>",
                      },
                  },
              ],
          }
          print(json.dumps(payload))
          PY

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data @slack-payload.json \
            "$SLACK_WEBHOOK_URL"
